<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Novvy — Install</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f17; color: #e8e8f0; min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px;
  }
  .card {
    width: 100%; max-width: 560px; background: #17171f; border: 1px solid #262635;
    border-radius: 16px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.5px; }
  h1 .dot { color: #7c8cff; }
  .sub { color: #8a8aa3; margin: 4px 0 24px; font-size: 14px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: none; border-radius: 10px;
    padding: 13px 18px; width: 100%; transition: transform .05s ease, filter .15s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .primary { background: #7c8cff; color: #0f0f17; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .ghost { background: #23232f; color: #e8e8f0; margin-top: 10px; }
  .ghost:hover:not(:disabled) { filter: brightness(1.15); }
  .row { display: flex; gap: 10px; }
  .divider { height: 1px; background: #262635; margin: 22px 0; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8a8aa3; margin-bottom: 10px; }
  #status { margin-top: 18px; font-size: 14px; line-height: 1.5; }
  .ok { color: #6ee7a8; }
  .err { color: #ff7a90; }
  .muted { color: #8a8aa3; }
  .devices { margin: 14px 0; display: grid; gap: 8px; }
  .device {
    display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #2c2c3d;
    border-radius: 10px; cursor: pointer; background: #1c1c26;
  }
  .device:hover { border-color: #7c8cff; }
  .device input { accent-color: #7c8cff; }
  .device .name { font-weight: 600; }
  .device .serial { color: #8a8aa3; font-size: 12px; font-family: ui-monospace, monospace; }
  pre {
    background: #0c0c12; border: 1px solid #262635; border-radius: 10px; padding: 12px;
    overflow: auto; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 12px;
  }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background:#23232f; color:#8a8aa3; }
  a.dl { color: #7c8cff; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Novvy<span class="dot">.</span></h1>
    <p class="sub">Download the APK or install it straight to a connected device.</p>

    <button id="installBtn" class="primary">Download &amp; install to my phone</button>
    <button id="downloadBtn" class="ghost">Just download the APK file</button>

    <div id="devicePanel" style="display:none">
      <div class="divider"></div>
      <div class="label">Choose a device</div>
      <div id="devices" class="devices"></div>
      <button id="confirmBtn" class="primary" style="display:none">Install to selected device</button>
    </div>

    <div id="status" class="muted">Ready.</div>
    <pre id="log" style="display:none"></pre>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const installBtn = $("installBtn");
const downloadBtn = $("downloadBtn");
const confirmBtn = $("confirmBtn");
const statusEl = $("status");
const logEl = $("log");
const devicePanel = $("devicePanel");
const devicesEl = $("devices");

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || "muted";
}
function showLog(text) {
  logEl.style.display = text ? "block" : "none";
  logEl.textContent = text || "";
}

downloadBtn.addEventListener("click", () => {
  // Native download of the APK file.
  window.location.href = "/download";
  setStatus("Downloading novvy.apk…", "muted");
});

installBtn.addEventListener("click", async () => {
  installBtn.disabled = true;
  setStatus("Looking for connected devices (adb devices)…", "muted");
  showLog("");
  try {
    const res = await fetch("/api/adb/devices");
    const data = await res.json();
    renderDevices(data);
  } catch (e) {
    setStatus("Failed to reach the server: " + e, "err");
  } finally {
    installBtn.disabled = false;
  }
});

function renderDevices(data) {
  devicesEl.innerHTML = "";
  confirmBtn.style.display = "none";

  if (!data.available) {
    devicePanel.style.display = "none";
    setStatus("ADB is not available on the machine running Novvy.", "err");
    showLog(data.error || "adb not found");
    return;
  }

  const usable = (data.devices || []).filter((d) => d.state === "device");
  if (usable.length === 0) {
    devicePanel.style.display = "none";
    setStatus("No devices connected. Plug your phone in via USB (enable USB debugging) — or run Novvy on the machine your phone is connected to.", "err");
    showLog("adb path: " + data.adb + "\n(no authorized devices)");
    return;
  }

  devicePanel.style.display = "block";
  setStatus("Found " + usable.length + " device(s). Pick one below.", "ok");

  usable.forEach((d, i) => {
    const label = document.createElement("label");
    label.className = "device";
    label.innerHTML =
      '<input type="radio" name="device" value="' + d.serial + '"' + (i === 0 ? " checked" : "") + ">" +
      '<span><span class="name">' + (d.model || d.serial) + '</span><br>' +
      '<span class="serial">' + d.serial + '</span></span>';
    devicesEl.appendChild(label);
  });
  confirmBtn.style.display = "block";
}

confirmBtn.addEventListener("click", async () => {
  const chosen = document.querySelector('input[name="device"]:checked');
  if (!chosen) { setStatus("Select a device first.", "err"); return; }
  const serial = chosen.value;
  confirmBtn.disabled = true;
  setStatus("Installing on " + serial + " … this can take up to a minute.", "muted");
  showLog("");
  try {
    const res = await fetch("/api/adb/install", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device: serial }),
    });
    const data = await res.json();
    if (data.ok) {
      setStatus("Success — Novvy was installed on " + serial + ".", "ok");
    } else {
      setStatus("Install failed. See details below.", "err");
    }
    showLog(data.output || data.error || "");
  } catch (e) {
    setStatus("Install request failed: " + e, "err");
  } finally {
    confirmBtn.disabled = false;
  }
});
</script>
</body>
</html>
